    <circle r="21" fill="#ffd35b" stroke="#013c58" stroke-width="3"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">5</text>
  </g>
  <!-- 6 Сочи и Красная Поляна -->
  <g transform="translate(185,545)">
    <circle r="21" fill="#ffd35b" stroke="#013c58" stroke-width="3"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">6</text>
  </g>
  <!-- 7 Кавказ и Эльбрус -->
  <g transform="translate(255,565)">
    <circle r="21" fill="#ffd35b" stroke="#013c58" stroke-width="3"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">7</text>
  </g>
  <!-- 8 Калининград и Балтика -->
  <g transform="translate(115,320)">
    <circle r="21" fill="#ffd35b" stroke="#013c58" stroke-width="3"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">8</text>
  </g>
  <!-- 9 Кольский полуостров -->
  <g transform="translate(275,145)">
    <circle r="21" fill="#ffd35b" stroke="#013c58" stroke-width="3"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">9</text>
  </g>
  <!-- 10 Горный Алтай -->
  <g transform="translate(545,485)">
    <circle r="21" fill="#ffd35b" stroke="#013c58" stroke-width="3"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">10</text>
  </g>
  <!-- 11 Озеро Байкал и Ольхон -->
  <g transform="translate(745,490)">
    <circle r="24" fill="#f5a201" stroke="#013c58" stroke-width="4"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">11</text>
  </g>
  <!-- 12 Вулканы Камчатки -->
  <g transform="translate(1045,315)">
    <circle r="21" fill="#ffd35b" stroke="#013c58" stroke-width="3"/>
    <text y="6" text-anchor="middle" fill="#013c58" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800">12</text>
  </g>
</svg>
